# Metrics, dashboards, and traces, on top of the local stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.obs.yml up --build
#
#   Grafana     http://localhost:3001   the "lobbyd" dashboard, no login needed
#   Prometheus  http://localhost:9090   metrics, and the alert rules under Alerts
#   Jaeger      http://localhost:16686  traces: pick the lobbyd-api service
#
# Kept out of the default stack so `docker compose up` stays small.

services:
  api:
    environment:
      LOBBYD_OTLP_ENDPOINT: http://jaeger:4318
  worker:
    environment:
      LOBBYD_OTLP_ENDPOINT: http://jaeger:4318

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana-oss:12.0.2
    environment:
      # A local demo: open straight to the dashboard, read-only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lobbyd.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  # All-in-one Jaeger: collector, storage in memory, and the UI.
  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - "16686:16686"
