# Local development stack: `docker compose up --build`
# The demo client is then at http://localhost:3000 and the API docs at
# http://localhost:8000/docs
#
# The credentials below are for local use only.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lobbyd
      POSTGRES_PASSWORD: lobbyd
      POSTGRES_DB: lobbyd
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobbyd -d lobbyd"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      LOBBYD_DATABASE_URL: postgresql+asyncpg://lobbyd:lobbyd@postgres:5432/lobbyd
      LOBBYD_REDIS_URL: redis://redis:6379/0
      LOBBYD_PAYSIM_URL: http://paysim:8001
      # Every request reaches the API through the web client's proxy.
      LOBBYD_TRUST_FORWARDED_FOR: "true"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: *api-build
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Relays the outbox, runs event handlers (payments, emails), and housekeeping.
  # Safe to scale: docker compose up --scale worker=3
  worker:
    build: *api-build
    command: ["lobbyd-worker"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Stand-in payment provider. Takes about 1.5 s to settle a payment, then
  # calls the API's webhook.
  paysim:
    build: *api-build
    command: ["uvicorn", "paysim.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PAYSIM_WEBHOOK_URL: http://api:8000/webhooks/payments
    ports: ["8001:8001"]

  # The demo client: http://localhost:3000
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      LOBBYD_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
