[project]
name = "lobbyd"
version = "0.1.0"
description = "Ticketing and registration backend for gaming tournaments and LAN events."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "structlog>=24.4",
    "tzdata>=2024.2",
]

[project.scripts]
lobbyd-seed = "lobbyd.seed:main"
lobbyd-admin = "lobbyd.cli:main"
lobbyd-worker = "lobbyd.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lobbyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_package = "lobbyd"

[[tool.importlinter.contracts]]
name = "modules depend only on the layers beneath them"
type = "layers"
layers = [
    "lobbyd.main | lobbyd.seed | lobbyd.cli | lobbyd.worker",
    "lobbyd.wiring",
    "lobbyd.orders",
    "lobbyd.inventory | lobbyd.tickets",
    "lobbyd.catalog",
    "lobbyd.identity",
    "lobbyd.platform",
]
