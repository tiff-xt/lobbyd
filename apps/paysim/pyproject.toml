[project]
name = "paysim"
version = "0.1.0"
description = "A payment provider simulator: asynchronous, signed webhooks, and failures on demand."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paysim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
