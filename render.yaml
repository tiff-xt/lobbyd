# Render blueprint for the hosted demo: one free web service and one free
# Key Value (Redis) instance. Postgres is on Neon, whose free plan does not
# expire. Step by step: docs/deploy.md
#
# The web service runs the API, the worker, and the payment simulator in one
# process (apps/demo), because a free plan has no background workers.

services:
  - type: web
    name: lobbyd-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Reads the port from $PORT itself, so there is no shell syntax to get wrong.
    dockerCommand: lobbyd-demo
    healthCheckPath: /healthz
    envVars:
      - key: LOBBYD_ENVIRONMENT
        value: production
      # Paste the connection string from Neon (the direct one, not "pooled").
      - key: LOBBYD_DATABASE_URL
        sync: false
      - key: LOBBYD_REDIS_URL
        fromService:
          type: keyvalue
          name: lobbyd-redis
          property: connectionString
      # Generated once by Render and kept. Never written down anywhere else.
      - key: LOBBYD_JWT_SECRET
        generateValue: true
      - key: LOBBYD_PAYSIM_WEBHOOK_SECRET
        generateValue: true
      - key: LOBBYD_TICKET_SIGNING_KEY
        generateValue: true
      # Sized for a 512 MB instance and the free database's connection limit.
      - key: LOBBYD_DB_POOL_SIZE
        value: "5"
      - key: LOBBYD_DB_MAX_OVERFLOW
        value: "5"
      - key: LOBBYD_REDIS_MAX_CONNECTIONS
        value: "20"
      # Requests arrive through Render's proxy and the web client's.
      - key: LOBBYD_TRUST_FORWARDED_FOR
        value: "true"
      - key: LOBBYD_WORKER_METRICS_PORT
        value: "0"
      # The assistant. Leave the key empty and it is simply switched off.
      # A free Gemini key comes from Google AI Studio (docs/deploy.md).
      - key: LOBBYD_ASSISTANT_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LOBBYD_ASSISTANT_MODEL
        value: gemini-3.5-flash-lite
      - key: LOBBYD_ASSISTANT_API_KEY
        sync: false
      # Well inside the free quota, so a busy day ends in "try later", not a bill.
      - key: LOBBYD_ASSISTANT_DAILY_TURNS
        value: "150"

  - type: keyvalue
    name: lobbyd-redis
    plan: free
    # Reachable only from this account's services.
    ipAllowList: []
    # Never evict: the event stream and the rate limiter live here.
    maxmemoryPolicy: noeviction
