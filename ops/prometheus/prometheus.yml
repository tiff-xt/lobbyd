# Scrapes the API and the worker every five seconds: short enough to watch a
# sale minute by minute. Used by docker-compose.obs.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
